services:
  web:
    image: node:24.16.0-bookworm
    working_dir: /workspace
    command: sh -c "corepack pnpm install --frozen-lockfile && corepack pnpm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - taskify-node-modules:/workspace/node_modules
    environment:
      NODE_ENV: development
      TASKIFY_WEB_HOSTNAME: 0.0.0.0

volumes:
  taskify-node-modules:
